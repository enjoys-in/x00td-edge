# Redis as a pure cache tier on the phone.
# PostgreSQL is the durable store on the real server, so persistence is OFF here
# to avoid hammering the eMMC (the device's weak spot).

bind 127.0.0.1
protected-mode yes
port 6379

# Cache budget — raise this, Redis is the primary read tier (plan §5/§6).
maxmemory 768mb
maxmemory-policy allkeys-lru

# Durability off: no RDB snapshots, no AOF. Data here is disposable cache.
save ""
appendonly no

tcp-keepalive 60
timeout 0
