# nginx reverse proxy for the Go API.
# Drop into /etc/nginx/http.d/edge.conf on Alpine (http.d is included by default).
# TLS is Phase 4 — start on :80 on the LAN, then add a 443 server block later.

upstream edge_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        proxy_pass http://edge_api;
        access_log off;
    }

    location / {
        proxy_pass http://edge_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
